<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects — Sidharth Unnikrishnan</title>
<meta name="description" content="Screenshots, demo videos, and details for projects by Sidharth Unnikrishnan — Ekadai, NutriBot, SplitMint, and Recall." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F4F2EC;
    --ink:#0E0E0C;
    --accent:#FF4D17;
    --muted:#8A8A82;
    --line:#D9D7CF;
    --dark:#121210;
    --dark-line:#2B2B28;
    --dark-muted:#7C7C76;
    --display:'Archivo',-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --maxw:1320px;
    --pad:clamp(20px,5vw,64px);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

  body{
    background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  .wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}

  /* ---------- nav ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid transparent;transition:border-color .3s;
  }
  header.scrolled{border-bottom-color:var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:80px;gap:20px}
  .logo{font-family:var(--display);font-weight:800;letter-spacing:.04em;font-size:18px;display:flex;align-items:center;gap:9px}
  .logo .dot{width:7px;height:7px;background:var(--accent)}
  .logo .end{color:var(--accent)}
  .back{font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:color .2s}
  .back:hover{color:var(--accent)}

  /* ---------- intro ---------- */
  .intro{padding-top:clamp(28px,4vw,56px);padding-bottom:clamp(28px,4vw,48px)}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .eyebrow::before{content:"-- "}
  .bigtitle{
    font-family:var(--display);font-weight:900;line-height:.86;letter-spacing:-.03em;text-transform:uppercase;
    font-size:clamp(48px,9vw,128px);margin-top:18px;
  }
  .bigtitle .end::after{content:"";display:inline-block;width:.14em;height:.14em;background:var(--accent);margin-left:.05em}
  .intro p{margin-top:24px;max-width:62ch;font-size:14px;line-height:1.7}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(28px,4vw,44px)}
  .chip{
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);background:transparent;
    padding:10px 16px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip .ct{color:var(--accent);margin-left:8px}

  /* ---------- index strip ---------- */
  .index{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-top:26px}
  .index a{padding:20px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:background .2s}
  .index a:last-child{border-right:0}
  .index a:hover{background:color-mix(in srgb,var(--bg) 55%,#fff)}
  .index a.dim{opacity:.35}
  .index .n{color:var(--accent);font-size:12px;letter-spacing:.12em}
  .index .t{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.005em}
  .index .s{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  @media(max-width:760px){
    .index{grid-template-columns:1fr 1fr}
    .index a:nth-child(2){border-right:0}
    .index a:nth-child(-n+2){border-bottom:1px solid var(--line)}
  }

  /* ---------- case studies ---------- */
  .case{padding-block:clamp(48px,7vw,96px);border-top:1px solid var(--line);scroll-margin-top:80px}
  .case[hidden]{display:none}
  .case-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(30px,4vw,64px);align-items:start}
  @media(max-width:960px){.case-grid{grid-template-columns:1fr}.case-media{order:-1}}

  .case-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .case-top .n{color:var(--accent);font-size:14px;letter-spacing:.1em}
  .status{font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);padding:6px 10px;display:inline-flex;align-items:center;gap:8px}
  .status::before{content:"";width:7px;height:7px;background:var(--accent)}
  .status.dev::before{background:transparent;border:1.5px solid var(--accent)}
  .case h2{font-family:var(--display);font-weight:900;font-size:clamp(34px,4.6vw,58px);line-height:.95;letter-spacing:-.02em;margin-top:20px;text-transform:uppercase}
  .case .sub{font-family:var(--display);font-weight:600;font-size:clamp(16px,1.6vw,19px);margin-top:10px;color:var(--muted)}
  .case .summary{margin-top:22px;font-size:14px;line-height:1.7}
  .case .label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:30px;margin-bottom:14px}
  .case .label::before{content:"– "}
  .hl{list-style:none;display:flex;flex-direction:column;gap:12px}
  .hl li{position:relative;padding-left:22px;font-size:13.5px;line-height:1.55}
  .hl li::before{content:"+";position:absolute;left:0;color:var(--accent);font-weight:700}
  .hl li.planned{color:var(--muted)}
  .hl li.planned::before{content:"○";font-weight:400}
  .stack{display:flex;flex-direction:column;border:1px solid var(--line)}
  .stack .row{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
  .stack .row:last-child{border-bottom:0}
  .stack .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:2px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:7px 12px}

  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
  .btn{
    font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    padding:14px 20px;display:inline-flex;gap:10px;align-items:center;border:1px solid var(--ink);
    transition:background .2s,color .2s,filter .2s;cursor:pointer;background:transparent;
  }
  .btn:hover{background:var(--ink);color:var(--bg)}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.solid:hover{filter:brightness(1.08)}
  .btn.off{border-style:dashed;border-color:var(--line);color:var(--muted);cursor:default}
  .btn.off:hover{background:transparent;color:var(--muted)}

  /* ---------- media ---------- */
  .case-media{position:sticky;top:100px}
  @media(max-width:960px){.case-media{position:static}}
  .tabs{display:flex;border:1px solid var(--line);border-bottom:0}
  .tab{flex:1;padding:12px 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:transparent;border:0;border-right:1px solid var(--line);cursor:pointer;color:var(--muted);transition:color .2s,background .2s}
  .tab:last-child{border-right:0}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink);background:color-mix(in srgb,var(--bg) 55%,#fff);box-shadow:inset 0 -2px 0 var(--accent)}
  .tab:disabled{cursor:default;opacity:.45}
  .viewer{border:1px solid var(--line);background:#e9e7e0;aspect-ratio:16/10;position:relative;overflow:hidden}
  .viewer.tall{aspect-ratio:4/5}
  .viewer iframe,.viewer video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .viewer .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:zoom-in;background:#e9e7e0}
  .viewer .nav-btn{
    position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:1px solid var(--ink);
    background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,color .2s;
  }
  .viewer .nav-btn:hover{background:var(--ink);color:var(--bg)}
  .viewer .prev{left:12px}
  .viewer .next{right:12px}
  .viewer .count{position:absolute;right:12px;bottom:12px;background:var(--ink);color:var(--bg);font-size:11px;letter-spacing:.12em;padding:5px 9px}
  .viewer .cap{position:absolute;left:12px;bottom:12px;max-width:70%;background:var(--bg);font-size:12px;padding:6px 10px;border:1px solid var(--line)}
  .empty{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;
    background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--line) 55%,transparent) 14px 15px);
  }
  .empty .big{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.6vw,30px);text-transform:uppercase;letter-spacing:-.01em}
  .empty .small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .video-link{display:flex;flex-direction:column;align-items:center;gap:16px}
  .play{width:78px;height:78px;background:var(--accent);display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .video-link:hover .play{transform:scale(1.06)}
  .play svg{width:26px;height:26px;fill:#fff;margin-left:4px}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
  .thumb{aspect-ratio:16/10;border:1px solid var(--line);padding:0;background:#e9e7e0;cursor:pointer;overflow:hidden;opacity:.6;transition:opacity .2s,border-color .2s}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb:hover{opacity:1}
  .thumb[aria-current="true"]{opacity:1;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

  /* ---------- lightbox ---------- */
  dialog.lb{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100vh;color:var(--bg)}
  dialog.lb::backdrop{background:rgba(14,14,12,.94)}
  .lb-inner{position:absolute;inset:0;display:flex;flex-direction:column}
  .lb-bar{display:flex;justify-content:space-between;align-items:center;padding:16px var(--pad);font-size:12px;letter-spacing:.14em;text-transform:uppercase;gap:16px}
  .lb-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 var(--pad) 24px;min-height:0;position:relative}
  .lb-stage img{max-width:100%;max-height:100%;object-fit:contain}
  .lb-btn{width:46px;height:46px;border:1px solid var(--dark-line);background:transparent;color:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s;flex:0 0 auto}
  .lb-btn:hover{background:var(--accent);border-color:var(--accent)}
  .lb-stage .lb-btn{position:absolute;top:50%;transform:translateY(-50%)}
  .lb-stage .lb-prev{left:12px}
  .lb-stage .lb-next{right:12px}

  footer{background:var(--dark);color:var(--dark-muted);border-top:1px solid var(--dark-line)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:30px;flex-wrap:wrap;font-size:12px;letter-spacing:.06em}
  .foot a:hover{color:var(--accent)}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>

const PROJECTS = [
  {

      { src: 'projects/ekadai/07-powerbi-overview.webp', caption: 'Power BI — business overview KPIs' },

      { src: 'projects/ekadai/09-powerbi-products.webp', caption: 'Product performance & 7-day view → purchase attribution' },
      { src: 'projects/ekadai/10-powerbi-data-quality.webp', caption: 'Data quality, reference resolution & late-data replay' },
      { src: 'projects/ekadai/11-powerbi-pipeline-health.webp', caption: 'Pipeline health — flow metrics, runs & Debezium status' },

const CATS = { all: 'All', ai: 'AI / GenAI', data: 'Data Engineering', fullstack: 'Full-Stack', mobile: 'Mobile' };

/* ---------- helpers ---------- */
const esc = (str) => String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');

function embedUrl(url) {
  if (!url) return null;
  let u;
  try { u = new URL(url); } catch { return null; }
  const host = u.hostname.replace(/^www\./, '');
  if (host === 'youtu.be') return 'https://www.youtube-nocookie.com/embed/' + u.pathname.slice(1);
  if (host.endsWith('youtube.com')) {
    const id = u.searchParams.get('v') || (u.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/) || [])[1];
    if (id) return 'https://www.youtube-nocookie.com/embed/' + id;
  }
  if (host === 'loom.com') {
    const id = (u.pathname.match(/\/(?:share|embed)\/([^/?]+)/) || [])[1];
    if (id) return 'https://www.loom.com/embed/' + id;
  }
  if (host === 'drive.google.com') {
    const id = (u.pathname.match(/\/file\/d\/([^/]+)/) || [])[1] || u.searchParams.get('id');
    if (id) return 'https://drive.google.com/file/d/' + id + '/preview';
  }
  if (host === 'vimeo.com') {
    const id = (u.pathname.match(/\/(\d+)/) || [])[1];
    if (id) return 'https://player.vimeo.com/video/' + id;
  }
  return null;
}
const isVideoFile = (url) => /\.(mp4|webm|mov)(\?|#|$)/i.test(url || '');

/* ---------- render ---------- */
const casesEl = document.getElementById('cases');
const indexEl = document.getElementById('index');
const filtersEl = document.getElementById('filters');

function renderCase(p, i) {
  const hl = p.highlights.map((h) => typeof h === 'string'
    ? `<li>${esc(h)}</li>`
    : `<li class="${h.planned ? 'planned' : ''}">${esc(h.text)}</li>`).join('');
  const stack = Object.entries(p.stack).map(([k, v]) =>
    `<div class="row"><span class="k">${esc(k)}</span><span>${esc(v)}</span></div>`).join('');
  const tags = p.cats.map((c) => `<span class="tag">${esc(CATS[c])}</span>`).join('');

  const actions = [];
  if (p.demo) actions.push(`<a class="btn solid" href="${esc(p.demo)}" target="_blank" rel="noopener">▶ Watch Demo</a>`);
  if (p.live) actions.push(`<a class="btn" href="${esc(p.live)}" target="_blank" rel="noopener">Live App ↗</a>`);
  if (p.code) actions.push(`<a class="btn" href="${esc(p.code)}" target="_blank" rel="noopener">Source Code ↗</a>`);
  if (!actions.length) actions.push(`<span class="btn off">${p.status === 'In Development' ? 'Demo coming soon' : 'Links coming soon'}</span>`);

  return `
  <section class="case" id="${esc(p.slug)}" data-cats="${esc(p.cats.join(' '))}">
    <div class="wrap case-grid">
      <div class="reveal">
        <div class="case-top">
          <span class="n">// ${pad(i + 1)}</span>
          <span class="status ${p.status === 'In Development' ? 'dev' : ''}">${esc(p.status)}</span>
        </div>
        <h2>${esc(p.title)}</h2>
        <div class="sub">${esc(p.subtitle)}</div>
        <p class="summary">${esc(p.summary)}</p>
        <div class="label">Highlights</div>
        <ul class="hl">${hl}</ul>
        <div class="label">Stack</div>
        <div class="stack">${stack}</div>
        <div class="label">Area</div>
        <div class="tags">${tags}</div>
        <div class="actions">${actions.join('')}</div>
      </div>
      <div class="case-media reveal" data-slug="${esc(p.slug)}"></div>
    </div>
  </section>`;
}

/* media panel: Demo / Screenshots tabs */
function mountMedia(p) {
  const root = document.querySelector(`.case-media[data-slug="${p.slug}"]`);
  const shots = p.screenshots || [];
  const state = { tab: p.demo ? 'demo' : 'shots', idx: 0 };

  function draw() {
    const tall = p.portrait && state.tab === 'shots' ? ' tall' : '';
    let body = '';
    if (state.tab === 'demo') {
      const emb = embedUrl(p.demo);
      if (emb) body = `<iframe src="${esc(emb)}" title="${esc(p.title)} demo video" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
      else if (isVideoFile(p.demo)) body = `<video src="${esc(p.demo)}" controls preload="metadata"></video>`;
      else if (p.demo) body = `<div class="empty"><a class="video-link" href="${esc(p.demo)}" target="_blank" rel="noopener"><span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span><span class="small">Watch the demo ↗</span></a></div>`;
      else body = `<div class="empty"><span class="big">Demo video</span><span class="small">Coming soon</span></div>`;
    } else if (shots.length) {
      const s = shots[state.idx];
      body = `<img class="shot" src="${esc(s.src)}" alt="${esc(s.caption || p.title + ' screenshot ' + (state.idx + 1))}" />`;
      if (shots.length > 1) body += `<button class="nav-btn prev" aria-label="Previous screenshot">←</button><button class="nav-btn next" aria-label="Next screenshot">→</button>`;
      if (s.caption) body += `<span class="cap">${esc(s.caption)}</span>`;
      body += `<span class="count">${pad(state.idx + 1)} / ${pad(shots.length)}</span>`;
    } else {
      body = `<div class="empty"><span class="big">Screenshots</span><span class="small">${p.status === 'In Development' ? 'Arriving as the build progresses' : 'Coming soon'}</span></div>`;
    }

    const thumbs = state.tab === 'shots' && shots.length > 1
      ? `<div class="thumbs">${shots.map((s, i) => `<button class="thumb" data-i="${i}" aria-label="Show screenshot ${i + 1}" ${i === state.idx ? 'aria-current="true"' : ''}><img src="${esc(s.src)}" alt="" loading="lazy" /></button>`).join('')}</div>`
      : '';

    // Only offer the switcher when there is both a video and screenshots
    const tabs = p.demo && shots.length
      ? `<div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="demo" aria-selected="${state.tab === 'demo'}">Demo Video</button>
        <button class="tab" role="tab" data-tab="shots" aria-selected="${state.tab === 'shots'}">Screenshots (${shots.length})</button>
      </div>`
      : '';

    root.innerHTML = `
      ${tabs}
      <div class="viewer${tall}">${body}</div>
      ${thumbs}`;
  }

  root.addEventListener('click', (e) => {
    const t = e.target.closest('button, img.shot');
    if (!t) return;
    if (t.dataset.tab) state.tab = t.dataset.tab;
    else if (t.classList.contains('prev')) state.idx = (state.idx - 1 + shots.length) % shots.length;
    else if (t.classList.contains('next')) state.idx = (state.idx + 1) % shots.length;
    else if (t.dataset.i) state.idx = +t.dataset.i;
    else if (t.classList.contains('shot')) return openLightbox(p, state.idx);
    else return;
    draw();
  });
  draw();
}

/* filters + index */
function renderFilters() {
  const counts = { all: PROJECTS.length };
  PROJECTS.forEach((p) => p.cats.forEach((c) => (counts[c] = (counts[c] || 0) + 1)));
  filtersEl.innerHTML = Object.entries(CATS).filter(([k]) => counts[k])
    .map(([k, v]) => `<button class="chip" data-cat="${k}" aria-pressed="${k === 'all'}">${esc(v)}<span class="ct">${pad(counts[k])}</span></button>`).join('');
  filtersEl.addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    const cat = b.dataset.cat;
    filtersEl.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b));
    document.querySelectorAll('.case').forEach((el) => {
      el.hidden = cat !== 'all' && !el.dataset.cats.split(' ').includes(cat);
    });
    indexEl.querySelectorAll('a').forEach((a) => {
      const p = PROJECTS.find((x) => x.slug === a.dataset.slug);
      a.classList.toggle('dim', cat !== 'all' && !p.cats.includes(cat));
    });
  });
}

indexEl.innerHTML = PROJECTS.map((p, i) =>
  `<a href="#${esc(p.slug)}" data-slug="${esc(p.slug)}"><span class="n">// ${pad(i + 1)}</span><span class="t">${esc(p.title)}</span><span class="s">${esc(p.status)}</span></a>`).join('');
casesEl.innerHTML = PROJECTS.map(renderCase).join('');
PROJECTS.forEach(mountMedia);
renderFilters();

/* ---------- lightbox ---------- */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbTitle = document.getElementById('lbTitle');
let lbState = null;
function drawLightbox() {
  const { p, i } = lbState;
  const s = p.screenshots[i];
  lbImg.src = s.src;
  lbImg.alt = s.caption || p.title + ' screenshot ' + (i + 1);
  lbTitle.textContent = `${p.title} — ${pad(i + 1)} / ${pad(p.screenshots.length)}${s.caption ? ' · ' + s.caption : ''}`;
  const multi = p.screenshots.length > 1;
  document.getElementById('lbPrev').hidden = !multi;
  document.getElementById('lbNext').hidden = !multi;
}
function openLightbox(p, i) { lbState = { p, i }; drawLightbox(); lb.showModal(); }
function stepLightbox(d) {
  const n = lbState.p.screenshots.length;
  lbState.i = (lbState.i + d + n) % n;
  drawLightbox();
}
document.getElementById('lbClose').addEventListener('click', () => lb.close());
document.getElementById('lbPrev').addEventListener('click', () => stepLightbox(-1));
document.getElementById('lbNext').addEventListener('click', () => stepLightbox(1));
lb.addEventListener('click', (e) => { if (e.target === lb || e.target.classList.contains('lb-stage')) lb.close(); });
lb.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') stepLightbox(-1);
  if (e.key === 'ArrowRight') stepLightbox(1);
});

/* ---------- page chrome ---------- */
document.getElementById('year').textContent = new Date().getFullYear();
const header = document.querySelector('header');
const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 10);
onScroll(); window.addEventListener('scroll', onScroll, { passive: true });

const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: 0, rootMargin: '0px 0px -20px 0px' });
document.querySelectorAll('.reveal').forEach((el) => io.observe(el));

/* jump to #slug after the sections exist */
if (location.hash) {
  const target = document.querySelector(location.hash);
  if (target) {
    target.querySelectorAll('.reveal').forEach((el) => el.classList.add('in'));
    requestAnimationFrame(() => target.scrollIntoView());
  }
}
</script>
</body>
</html>
